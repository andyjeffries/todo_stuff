{{define "auth-content"}}
{{with .Error}}
<div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{.}}</div>
{{end}}
<form method="POST" action="/setup" class="space-y-4">
  <div>
    <label for="name" class="block text-sm font-medium text-stone-700 mb-1">Your name</label>
    <input id="name" name="name" type="text" required autofocus
           value="{{.Name}}"
           class="block w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-200">
  </div>
  <div>
    <label for="email" class="block text-sm font-medium text-stone-700 mb-1">Email</label>
    <input id="email" name="email" type="email" required
           value="{{.Email}}"
           class="block w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-200">
  </div>
  <div>
    <label for="password" class="block text-sm font-medium text-stone-700 mb-1">Password</label>
    <input id="password" name="password" type="password" required minlength="8"
           class="block w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-200">
    <p class="mt-1 text-xs text-stone-500">At least 8 characters.</p>
  </div>
  <button type="submit"
          class="w-full rounded-lg bg-amber-400 px-3 py-2 text-sm font-semibold text-stone-900 shadow-sm transition hover:bg-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300">
    Create Admin
  </button>
</form>
{{end}}
