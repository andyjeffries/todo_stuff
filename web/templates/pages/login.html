{{define "auth-content"}}
{{with .Error}}
<div class="mb-4 rounded-lg border border-red-200 dark:border-red-800 bg-red-50 dark:bg-red-900/30 px-3 py-2 text-sm text-red-700 dark:text-red-300">{{.}}</div>
{{end}}
<form method="POST" action="/login" class="space-y-4">
  <div>
    <label for="email" class="block text-sm font-medium text-stone-700 dark:text-stone-200 mb-1">Email</label>
    <input id="email" name="email" type="email" required autofocus
           value="{{.Email}}"
           class="block w-full rounded-lg border border-stone-300 dark:border-stone-600 bg-white dark:bg-stone-900 px-3 py-2 text-sm text-stone-900 dark:text-stone-100 shadow-sm focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-200">
  </div>
  <div>
    <label for="password" class="block text-sm font-medium text-stone-700 dark:text-stone-200 mb-1">Password</label>
    <input id="password" name="password" type="password" required
           class="block w-full rounded-lg border border-stone-300 dark:border-stone-600 bg-white dark:bg-stone-900 px-3 py-2 text-sm text-stone-900 dark:text-stone-100 shadow-sm focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-200">
  </div>
  <label for="remember" class="flex items-center gap-2 text-sm text-stone-700 dark:text-stone-200 select-none">
    <input id="remember" name="remember" type="checkbox" value="1" {{if .Remember}}checked{{end}}
           class="h-4 w-4 rounded border-stone-300 dark:border-stone-600 bg-white dark:bg-stone-900 text-amber-400 focus:ring-amber-300">
    Remember me for a year
  </label>
  <button type="submit"
          class="w-full rounded-lg bg-amber-400 px-3 py-2 text-sm font-semibold text-stone-900 shadow-sm transition hover:bg-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300">
    Sign in
  </button>
</form>
{{end}}
