{{define "app-content"}}
<header class="mb-8">
  <h1 class="flex items-center gap-3 text-3xl font-semibold tracking-tight text-stone-900">
    {{template "icon-inbox" "h-7 w-7 text-stone-500"}}
    {{.Heading}}
  </h1>
  {{with .Subheading}}<p class="mt-1 text-sm text-stone-500">{{.}}</p>{{end}}
</header>

<div class="rounded-2xl border border-dashed border-stone-300 bg-white px-6 py-16 text-center">
  <div class="mx-auto mb-3 inline-flex h-10 w-10 items-center justify-center rounded-full bg-stone-100 text-stone-500">
    {{template "icon-inbox" "h-5 w-5"}}
  </div>
  <p class="text-sm font-medium text-stone-700">Your Inbox is empty.</p>
  <p class="mt-1 text-xs text-stone-500">Drop quick tasks here when you don't know where they belong yet.</p>
</div>
{{end}}
