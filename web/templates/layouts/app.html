{{define "app"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{.Title}} · TodoStuff</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="h-full bg-stone-50 text-stone-900 antialiased">
  <div class="flex h-screen overflow-hidden">
    {{template "sidebar" .}}

    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <div class="flex-1 overflow-y-auto">
        <div class="mx-auto w-full max-w-2xl px-6 sm:px-8 py-10">
          {{template "app-content" .}}
        </div>
      </div>
    </main>
  </div>

  {{/* Floating action button — opens the quick-add modal from anywhere. */}}
  <button type="button" data-quick-add
          aria-label="Quick add task"
          class="fixed bottom-6 right-6 z-30 inline-flex h-12 w-12 items-center justify-center rounded-full bg-amber-400 text-stone-900 shadow-lg shadow-amber-400/30 hover:bg-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-300">
    {{template "icon-plus" "h-5 w-5"}}
  </button>

  {{template "quick-add-modal" .}}

  <div id="detail-backdrop"
       class="fixed inset-0 z-30 bg-stone-900/20 opacity-0 pointer-events-none transition-opacity duration-300 ease-out"
       aria-hidden="true"></div>

  <aside id="detail-panel"
         role="dialog"
         aria-modal="true"
         aria-hidden="true"
         tabindex="-1"
         class="fixed inset-y-0 right-0 z-40 flex w-full max-w-md flex-col border-l border-stone-200 bg-white shadow-xl
                translate-x-full transition-transform duration-300 ease-out">
    <header class="flex items-center justify-between px-5 py-3 border-b border-stone-200">
      <h2 class="text-sm font-medium text-stone-700">Task</h2>
      <button type="button" data-detail-close
              class="rounded-md p-1 text-stone-400 hover:bg-stone-100 hover:text-stone-700"
              aria-label="Close task detail">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
      </button>
    </header>
    <div id="detail-panel-body" class="flex-1 overflow-y-auto p-5">
      <p class="text-sm text-stone-400">Select a task to see its details.</p>
    </div>
  </aside>

  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</body>
</html>
{{end}}
