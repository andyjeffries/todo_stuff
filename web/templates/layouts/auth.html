{{define "auth"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{.Title}} · TodoStuff</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="min-h-screen bg-stone-50 text-stone-900 antialiased flex items-center justify-center px-4">
  <main class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-amber-400 text-stone-900 font-semibold text-lg shadow-sm">T</div>
      <h1 class="mt-4 text-2xl font-semibold tracking-tight">{{.Title}}</h1>
      {{with .Subtitle}}<p class="mt-1 text-sm text-stone-500">{{.}}</p>{{end}}
    </div>
    <div class="rounded-2xl border border-stone-200 bg-white p-6 shadow-sm">
      {{template "auth-content" .}}
    </div>
  </main>
</body>
</html>
{{end}}
