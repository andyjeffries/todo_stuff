{{define "auth"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{.Title}} · TodoStuff</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/static/brand/todostuff-icon.svg">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#efe9de">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="min-h-screen bg-stone-50 text-stone-900 antialiased flex items-center justify-center px-4">
  <div id="htmx-progress" aria-hidden="true"></div>
  <main class="w-full max-w-sm">
    <div class="text-center mb-8">
      <img src="/static/brand/todostuff-icon-128.png" alt="" width="56" height="56" class="mx-auto h-14 w-14 rounded-xl shadow-sm">
      <h1 class="mt-4 text-2xl font-semibold tracking-tight">{{.Title}}</h1>
      {{with .Subtitle}}<p class="mt-1 text-sm text-stone-500">{{.}}</p>{{end}}
    </div>
    <div class="rounded-2xl border border-stone-200 bg-white p-6 shadow-sm">
      {{template "auth-content" .}}
    </div>
  </main>
</body>
</html>
{{end}}
