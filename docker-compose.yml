# TodoStuff — self-host with Docker Compose.
#
# Pulls the prebuilt image published by the `Build & publish Docker image`
# GitHub Action (see .github/workflows/docker.yml). Swap `image:` for
# `build: .` if you want to build from a local checkout instead.
#
# Quick start:
#   cp .env.example .env       # optional — defaults work for localhost
#   docker compose up -d
#   open http://localhost:8636

services:
  todostuff:
    image: ghcr.io/andyjeffries/todo_stuff:latest
    container_name: todostuff
    ports:
      - "8636:8636"
    volumes:
      - todostuff_data:/data
    environment:
      DATABASE_PATH: /data/todostuff.db
      PUSHOVER_APP_TOKEN: ${PUSHOVER_APP_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-UTC}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8636/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  todostuff_data:
